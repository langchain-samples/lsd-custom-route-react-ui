[project]
name = "lsd-react-ui-cr"
version = "0.1.0"
description = "LangChain Agent + React UI served via LangSmith Deployments custom routes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.4.11",
    "fastapi>=0.135.1",
    "langchain>=1.2.13",
    "langchain-anthropic>=1.4.0",
    "langchain-tavily>=0.2.17",
    "langgraph-cli[inmem]>=0.4.18",
    "markdownify>=1.2.2",
    "tavily>=1.1.0",
]

[tool.setuptools.package-dir]
"" = "src/deep_research"

[tool.setuptools.packages.find]
where = ["src/deep_research"]
